[package]
name = "i3tctl"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "ice3tier 的管理命令行"

[dependencies]
i3t-lang = { path = "../../crates/i3t-lang" }
i3t-model = { path = "../../crates/i3t-model" }
i3t-proto = { path = "../../crates/i3t-proto" }
anyhow.workspace = true
clap = { workspace = true, features = ["env"] }
ipnet.workspace = true
# 管理 API 是回环上的明文 HTTP，所以不带 TLS，也不读系统代理的设置：管理令牌不该经过别的代理。
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[lints]
workspace = true

[dev-dependencies]
i3t-controller = { path = "../../crates/i3t-controller", features = ["testing"] }
i3t-crypto = { path = "../../crates/i3t-crypto" }
i3t-update = { path = "../../crates/i3t-update" }
ring.workspace = true
tempfile.workspace = true

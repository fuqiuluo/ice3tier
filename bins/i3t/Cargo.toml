[package]
name = "i3t"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "ice3tier 的节点程序"

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["env"] }
i3t-agent = { path = "../../crates/i3t-agent" }
i3t-lang = { path = "../../crates/i3t-lang" }
i3t-model = { path = "../../crates/i3t-model" }
i3t-proto = { path = "../../crates/i3t-proto" }
i3t-underlay = { path = "../../crates/i3t-underlay" }
i3t-update = { path = "../../crates/i3t-update" }
i3t-vnet = { path = "../../crates/i3t-vnet" }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

[target."cfg(unix)".dependencies]
rlimit = "0.11.0"

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2.191"

[target."cfg(windows)".dependencies]
windows-service = "0.8.1"

[package]
name = "i3t-controller"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "ice3tier 的 controller：存储、注册、访问规则编译、netmap、节点协议、管理 API"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "query"] }
base64.workspace = true
flate2 = "1.1.11"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
i3t-crypto = { path = "../i3t-crypto" }
i3t-metrics = { path = "../i3t-metrics" }
i3t-model = { path = "../i3t-model" }
i3t-proto = { path = "../i3t-proto" }
i3t-underlay = { path = "../i3t-underlay" }
i3t-update = { path = "../i3t-update" }
ipnet.workspace = true
maxminddb = "0.33.0"
ring.workspace = true
rusqlite = { version = "0.43.0", features = ["bundled"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", default-features = false, features = ["fs"] }
tracing.workspace = true
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true

[package]
name = "i3t-controller"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "ice3tier 的 controller：存储、注册、访问规则编译、netmap、节点协议、管理 API"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "query"] }
base64.workspace = true
bytes.workspace = true
flate2 = "1.1.11"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
i3t-crypto = { path = "../i3t-crypto" }
i3t-metrics = { path = "../i3t-metrics" }
i3t-model = { path = "../i3t-model" }
i3t-proto = { path = "../i3t-proto" }
i3t-underlay = { path = "../i3t-underlay" }
i3t-update = { path = "../i3t-update" }
ipnet.workspace = true
maxminddb = "0.33.0"
ring.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-postgres = { version = "0.7.18", default-features = false, features = ["runtime"] }
tokio-rustls.workspace = true
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", default-features = false, features = ["fs"] }
tracing.workspace = true
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }

[features]
# 测试用的空数据库（`store::Scratch`、`Store::temporary`）：给别的包的测试用。
testing = []

[lints]
workspace = true

[dev-dependencies]
# 这个包自己的集成测试（`tests/`）也要用测试用的空数据库。
i3t-controller = { path = ".", features = ["testing"] }
# 测试里接住数据库驱动打的日志（它用的是 log）。
log = "0.4"
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true

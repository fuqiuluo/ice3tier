[package]
name = "i3t-agent"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "ice3tier 的节点装配层：本地状态、连 controller、把各层装成一个节点"

[dependencies]
anyhow.workspace = true
gethostname = "1.1.0"
i3t-access = { path = "../i3t-access" }
i3t-conn = { path = "../i3t-conn" }
i3t-crypto = { path = "../i3t-crypto" }
i3t-exit = { path = "../i3t-exit" }
i3t-flow = { path = "../i3t-flow" }
i3t-lang = { path = "../i3t-lang" }
i3t-lane = { path = "../i3t-lane" }
i3t-metrics = { path = "../i3t-metrics" }
i3t-model = { path = "../i3t-model" }
i3t-proto = { path = "../i3t-proto" }
i3t-underlay = { path = "../i3t-underlay" }
i3t-update = { path = "../i3t-update" }
i3t-vnet = { path = "../i3t-vnet" }
if-addrs.workspace = true
ipnet.workspace = true
rand = "0.10.4"
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
toml = "1.2.1"
toml_edit = "0.25.19"
tracing.workspace = true

[lints]
workspace = true

[dev-dependencies]
i3t-flow = { path = "../i3t-flow", features = ["test-util"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_SystemServices"] }

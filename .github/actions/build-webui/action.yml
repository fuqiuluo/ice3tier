# 构建发布使用的 WebUI（web/dist）：Node.js 的版本固定在下方，pnpm 的版本取自 web/package.json 的 packageManager，
# 依赖按 web/pnpm-lock.yaml 从 registry 下载。不读取也不写入缓存：缓存由其他流水线写入，不应进入待签名的程序。
# 发布流程与每日的发布演练共用本 action。
name: Build the WebUI
description: Build web/dist with pinned Node.js and pnpm, from the lockfile and without any cache
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      with:
        package_json_file: web/package.json
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22.23.5
    - name: Build
      shell: bash
      working-directory: web
      run: |
        pnpm install --frozen-lockfile
        pnpm build

# 构建发布用的 WebUI（web/dist）：Node.js 的版本写死在下面，pnpm 的在 web/package.json 的 packageManager，
# 依赖照 web/pnpm-lock.yaml 现下。不读也不写缓存：缓存是别的流水线写的，不该进到要签名的程序里。
# 发布和每天的发布演练都用它。
name: Build the WebUI
description: Build web/dist with pinned Node.js and pnpm, from the lockfile and without any cache
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      with:
        package_json_file: web/package.json
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22.23.5
    - name: Build
      shell: bash
      working-directory: web
      run: |
        pnpm install --frozen-lockfile
        pnpm build

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # 一个卡住的测试不让任务跑到平台的上限（6 小时）：全部测试正常在十几分钟里跑完。
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check
      - name: One version everywhere
        if: matrix.os == 'ubuntu-latest'
        run: scripts/bump-version.sh --check
      # fuzz/ 自成一个 workspace，平时 cargo test 不碰它；这里只做编译检查，防止内部接口变动把 fuzz 目标改坏。
      - name: Fuzz targets compile
        if: matrix.os == 'ubuntu-latest'
        run: cargo check --manifest-path fuzz/Cargo.toml --bins
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # 一个测试程序失败了也把剩下的跑完：一次运行就看得到这个平台上全部的失败。
      - name: Test
        run: cargo test --workspace --no-fail-fast

  # 真的建一块虚拟网卡、配上地址和路由、再拆掉（`i3t-vnet` 的 `a_real_device_…` 测试）：这台开发机上只能在 Linux 上做，
  # Windows 和 macOS 的 CI 机器以管理员 / 可以 sudo 的用户运行，在这里做。Windows 上 wintun.dll 要放在测试程序旁边
  # （测试程序的路径写成正斜杠：Git Bash 的 dirname 不认反斜杠）。Linux 上另有一个：开了分段卸载的网卡和内核对着收发，
  # 切包、合包、补校验和都在这台机器的内核上走一遍。
  vnet-device:
    name: virtual adapter smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the test
        shell: bash
        run: |
          cargo test -p i3t-vnet --lib --no-run --message-format=json \
            | "$(command -v python3 || command -v python)" -I -c "import json, sys; print([m['executable'] for m in map(json.loads, sys.stdin) if m.get('executable')][-1].replace(chr(92), '/'))" > test-program.txt
          cat test-program.txt
      - name: Wintun next to the test
        if: runner.os == 'Windows'
        shell: bash
        run: scripts/fetch-wintun.sh amd64 "$(dirname "$(cat test-program.txt)")"
      - name: Create, check and remove a device
        shell: bash
        env:
          I3T_VNET_DEVICE_TEST: "1"
        run: |
          program=$(cat test-program.txt)
          # Ubuntu 的 sudo 不把环境变量带过去（-E 也不带），所以经 env 设。
          case "$RUNNER_OS" in
            Linux) sudo env I3T_VNET_DEVICE_TEST=1 "$program" a_real_device --nocapture | tee device-test.txt ;;
            macOS) sudo -E "$program" a_real_device --nocapture | tee device-test.txt ;;
            *) "$program" a_real_device --nocapture | tee device-test.txt ;;
          esac
          # 没带上那个环境变量的话测试什么也不做就通过：看它真的建了网卡。
          grep -q '网卡 ' device-test.txt

  # 安装脚本在真的 systemd（ubuntu）和 launchd（macOS）上装一遍：不带令牌装、sudo i3t join 加入并启动、
  # 校验虚拟网卡与防火墙状态、覆盖重装、保留状态卸载再装、彻底卸载；Linux 上还测 controller 首次安装与原位升级。
  installer:
    name: install.sh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Lint, and the copies inside match deploy/
        if: runner.os == 'Linux'
        run: |
          shellcheck -s sh -S warning deploy/install.sh scripts/test-install.sh scripts/setup-e2e-env.sh
          for pair in "write_node_service deploy/systemd/i3t.service" \
                      "write_controller_service deploy/systemd/i3t-controller.service" \
                      "write_polkit_rule deploy/polkit/50-i3t-resolved.rules"; do
            set -- $pair
            awk -v f="$1() {" '$0 == f { getline; on = 1; next } on && /^EOF$/ { exit } on' deploy/install.sh | diff -u "$2" -
          done
      - name: Build
        run: cargo build -p i3t -p i3t-controller-bin -p i3tctl -p i3t-release
      - name: Install, join, reinstall, uninstall
        run: scripts/test-install.sh target/debug

  # Windows 的安装脚本在真的 Windows 上装一遍：装成系统服务、i3t join 加入并启动、校验虚拟网卡与防火墙规则、
  # 进程被杀之后服务自己回来、覆盖重装、从 zip 归档下载重装、卸载干净。用 Windows 自带的 PowerShell 5.1 跑。
  installer-windows:
    name: install.ps1 (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build -p i3t -p i3t-controller-bin -p i3tctl -p i3t-release
      - name: Wintun next to the program
        shell: bash
        run: scripts/fetch-wintun.sh amd64 target/debug
      - name: Install, join, crash, reinstall, uninstall
        shell: powershell
        run: scripts\test-install.ps1 target\debug

  web:
    name: web (format, lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1
          if-no-files-found: error

  # 一次编出 E2E、WebUI 联调和 resolved 测试共用的 release 二进制，同时验证 web/dist 正确嵌进了 i3t-controller。
  # 紧接着复用同一份 target/ 依赖缓存生成带临时测试签名钥匙的 release-kit，供 test_update.py 和 Playwright 联调共用。
  e2e-build:
    name: build release binaries & kit for e2e
    needs: [web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Build release binaries (with embedded WebUI)
        run: cargo build --release --locked -p i3t -p i3t-controller-bin -p i3tctl -p i3t-release
      - name: Smoke-test embedded WebUI and versions
        run: python3 scripts/smoke-release.py --bin-dir target/release --check-webui
      - name: Stage normal release binaries
        run: |
          mkdir -p e2e-bins
          cp target/release/i3t target/release/i3t-controller target/release/i3tctl e2e-bins/
      - name: Build update & web-e2e release kit
        run: CARGO_TARGET_DIR="$PWD/target" I3T_RELEASE_KIT="$PWD/e2e-kit" sh web/e2e/release-kit.sh
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-bins
          path: e2e-bins/*
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-kit
          path: e2e-kit
          retention-days: 1
          if-no-files-found: error

  # 用网络命名空间跑完整多节点端到端场景（tests/e2e/）：NAT 打洞、中继/TCP 回退、虚拟网卡与防火墙、
  # 代理与端口转发、UDP、配额限流、ice3proxy、断网恢复、主动探测、备份恢复、签名自动更新与回滚。
  e2e:
    name: e2e (${{ matrix.shard }})
    needs: [e2e-build]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: core, suites: "backup static paths mtu udp limits access" }
          - { shard: vnet, suites: "vnet" }
          - { shard: routing-probe, suites: "routing probe" }
          - { shard: lane, suites: "lane" }
          - { shard: managed, suites: "managed" }
          - { shard: recovery, suites: "recovery" }
          - { shard: update, suites: "update", kit: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: ${{ !matrix.kit }}
        with:
          name: e2e-bins
          path: e2e-bins
      - uses: actions/download-artifact@v4
        if: ${{ matrix.kit }}
        with:
          name: e2e-kit
          path: target/e2e-update/stage
      - name: Prepare binaries
        env:
          USE_KIT: ${{ matrix.kit && '1' || '0' }}
        run: |
          if [ "$USE_KIT" = "1" ]; then
            chmod +x target/e2e-update/stage/i3t-release target/e2e-update/stage/old/* target/e2e-update/stage/new/*
            cp target/e2e-update/stage/versions target/e2e-update/stage/done
            touch target/e2e-update/stage/done
          else
            chmod +x e2e-bins/*
          fi
      - name: Prepare Linux network namespace lab
        run: scripts/setup-e2e-env.sh
      - name: Run e2e suites
        env:
          SUITES: ${{ matrix.suites }}
          USE_KIT: ${{ matrix.kit && '1' || '0' }}
        run: |
          if [ "$USE_KIT" != "1" ]; then
            export I3T_BIN_DIR="$PWD/e2e-bins"
          fi
          failed=0
          for suite in $SUITES; do
            echo "::group::e2e $suite"
            if ! python3 "tests/e2e/test_${suite}.py"; then
              failed=$((failed + 1))
              echo "::error::e2e suite '$suite' failed"
            fi
            echo "::endgroup::"
          done
          [ "$failed" = 0 ]

  # WebUI 对着真实的 i3t-controller 和 i3t 节点跑完整个浏览器端到端套件（flows、routes、updates、limits、lanes、groups、mobile）。
  web-e2e:
    name: web e2e (Playwright)
    needs: [e2e-build]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: actions/download-artifact@v4
        with:
          name: e2e-kit
          path: web/.e2e/release-kit
      - name: Mark downloaded binaries executable
        working-directory: .
        run: chmod +x web/.e2e/release-kit/i3t-release web/.e2e/release-kit/old/* web/.e2e/release-kit/new/*
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright e2e flows
        run: pnpm exec playwright test --project=flows
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-e2e-results
          path: web/test-results
          retention-days: 7
          if-no-files-found: ignore

  # 在带真实 systemd-resolved 和 polkitd 的特权容器里验证非 root i3t 服务的透明域名解析与关闭清理。
  resolved:
    name: systemd-resolved + polkit (Linux)
    needs: [e2e-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: e2e-bins
          path: e2e-bins
      - name: Mark binaries executable
        run: chmod +x e2e-bins/*
      - name: Run systemd-resolved service-polkit test
        run: |
          version_id=$(. /etc/os-release && echo "$VERSION_ID")
          I3T_RESOLVED_BASE="ubuntu:${version_id}" tests/platform/resolved/run.sh e2e-bins resolved-out service-polkit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: resolved-logs
          path: resolved-out
          retention-days: 7
          if-no-files-found: ignore

  site:
    name: site (check, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.node-version
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
